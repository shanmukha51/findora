<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Findora</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">

</head>

<body class="auth-body">

<div class="auth-container">

<div class="auth-brand">

<a href="index.html" class="logo">
<span class="logo-icon">F</span>
<span>Find<span>ora</span></span>
</a>

</div>


<div class="auth-card">

<div class="auth-heading">

<div class="auth-icon">
✨
</div>

<h1>Create your account</h1>

<p>
Join your campus lost & found community.
</p>

</div>


<form id="registerForm">

<div class="form-group">

<label>Full Name</label>

<input
type="text"
name="name"
placeholder="Your full name"
required
>

</div>


<div class="form-group">

<label>Email Address</label>

<input
type="email"
name="email"
placeholder="you@example.com"
required
>

</div>


<div class="form-group">

<label>Password</label>

<input
type="password"
name="password"
placeholder="Create a password"
required
>

</div>


<div class="form-group">

<label>Confirm Password</label>

<input
type="password"
name="confirmPassword"
placeholder="Confirm your password"
required
>

</div>


<label class="checkbox terms">

<input type="checkbox" required>

I agree to the Findora terms and privacy policy.

</label>


<button type="submit" class="btn btn-primary btn-full">
    Create Account →
</button>

</form>


<div class="auth-divider">
<span>or</span>
</div>


<p class="auth-footer">

Already have an account?

<a href="login.html">
Login
</a>

</p>

</div>


<p class="auth-copyright">
© 2026 Findora. Built for students.
</p>

</div>


<div id="toast" class="toast"></div>

<script src="js/app.js"></script>
<script type="module" src="js/forms.js"></script>

</body>
</html>
